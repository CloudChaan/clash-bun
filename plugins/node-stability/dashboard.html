<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; form-action 'none'; base-uri 'none'">
  <title>节点稳定性</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6f5;--surface:#fff;--ink:#192b28;--muted:#6a7976;--line:#dce5e1;--accent:#177d62;--good:#2eae84;--bad:#dc796a;--none:#e2e8e5}
    :root[data-theme=dark]{color-scheme:dark;--bg:#1e1f27;--surface:#272b32;--ink:#e6eee9;--muted:#9caeaa;--line:#3a4546;--accent:#77dcb4;--good:#4daf8b;--bad:#cf7a6d;--none:#3a4246}
    *{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:14px 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select{font:inherit}h1{font-size:26px;letter-spacing:-.7px;margin:4px 0 8px}p{color:var(--muted);margin:0;line-height:1.7}.eyebrow{font:11px Consolas,monospace;letter-spacing:2px;color:var(--accent)}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.status{border:1px solid var(--line);padding:7px 12px;border-radius:20px;white-space:nowrap;color:var(--accent)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:24px}.metric{background:var(--surface);padding:18px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font:32px Consolas,monospace;display:block;margin-top:8px}.selections{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 24px}.selection{background:var(--surface);padding:16px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px}.selection small{color:var(--muted);display:block;margin-bottom:8px}.selection strong{word-break:break-all}.tools{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}input,select{border:1px solid var(--line);color:var(--ink);background:var(--surface);padding:9px 12px;border-radius:6px}input{flex:1;min-width:140px}.table-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--surface)}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);background:var(--bg);font-weight:500}td,th{padding:12px 16px;border-bottom:1px solid var(--line)}th button{border:0;background:none;color:inherit;cursor:pointer;padding:0}tr:last-child td{border-bottom:0}td.name{white-space:normal;min-width:155px;max-width:260px;word-break:break-word;font-weight:600}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;background:var(--muted)}.dot.good{background:var(--good)}.rate{font-family:Consolas,monospace;font-size:16px;color:var(--accent)}.days{display:flex;gap:3px}.day{width:12px;height:24px;border-radius:3px;background:var(--none)}.legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin-top:12px}.legend i{width:9px;height:9px;display:inline-block;background:var(--good);border-radius:2px}.legend i.bad{background:var(--bad)}.legend i.none{background:var(--none)}.empty{padding:44px;text-align:center;color:var(--muted)}.detail{margin-top:16px;padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.detail h2{font-size:16px;margin:0 0 8px}.detail .days{gap:8px;margin-top:12px}.detail .day{height:54px;flex:1;width:auto;display:flex;align-items:center;justify-content:center;font:12px Consolas,monospace;color:var(--ink)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--bg)}footer{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.8}@media(max-width:580px){body{padding:16px}.metrics{grid-template-columns:repeat(2,1fr)}.selections{grid-template-columns:1fr}.top{display:block}.status{display:inline-block;margin-top:12px}}
  </style>
</head>
<body>
  <div class="top"><div><div class="eyebrow">LOCAL RELIABILITY / 7 DAYS</div><h1>节点稳定性</h1><p id="description">等待第一次本机测试，统计将从启用插件后开始累积。</p></div><span id="status" class="status">等待数据</span></div>
  <div id="metrics" class="metrics"></div>
  <div id="selections" class="selections"></div>
  <div class="tools"><input id="search" aria-label="搜索节点" placeholder="搜索节点名称…"><select id="region" aria-label="地区"><option>全部地区</option><option>美国</option><option>香港</option><option>台湾</option><option>其他</option></select><select id="availability" aria-label="可达性"><option value="all">所有状态</option><option value="available">当前可达</option><option value="unavailable">未确认可达</option></select></div>
  <div class="table-wrap"><table><thead><tr><th>节点</th><th>地区</th><th><button id="sort">七天成功率 ↓</button></th><th>成功 / 测试</th><th>延迟中位数</th><th>过去七天 →</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">等待数据</div></div>
  <div class="legend"><i></i>稳定 <i class="bad"></i>存在失败 <i class="none"></i>无样本 · 点击节点查看详情</div>
  <div id="detail" class="detail" hidden></div>
  <footer>排名使用每五分钟一次的等频测试，避免重复手动测速影响排名。所有观测包含定时、切换检查及可读取的内核测速历史。离线期间暂停记录；“未确认可达”也包括结果过期的节点。<br><span id="updated"></span></footer>
  <script>
    let snapshot=null,descending=true,selected=null;
    const el=id=>document.getElementById(id);
    const text=(tag,value,className)=>{const node=document.createElement(tag);node.textContent=value;if(className)node.className=className;return node};
    const fmt=value=>value===null||value===undefined?'—':value;
    function days(values,detail=false){const row=document.createElement('div');row.className='days';values.forEach((value,index)=>{const cell=document.createElement('span');cell.className='day';cell.style.background=value===null?'var(--none)':value>=99?'var(--good)':value>=90?'#a6b976':'var(--bad)';cell.title=`${7-index} 天前至 ${6-index} 天前：${value===null?'无样本':value+'%'}`;if(detail)cell.textContent=value===null?'—':value+'%';row.append(cell)});return row}
    function renderDetail(){const node=snapshot?.rows.find(n=>n.id===selected);el('detail').hidden=!node;if(!node)return;el('detail').replaceChildren(text('h2',node.name),text('p',`定时失败 ${node.failures} 次 · 所有观测 ${node.observations} 次 · ${node.provisional?'观察期，样本少于 24 个':'已积累至少 24 个样本'} · 最近检测 ${node.lastTest?new Date(node.lastTest).toLocaleString():'暂无'}`),days(node.days,true))}
    function render(){if(!snapshot)return;el('description').textContent=snapshot.description;el('status').textContent=snapshot.status==='running'?'● 本机监测中':'○ 已暂停';el('metrics').replaceChildren(...snapshot.metrics.map(m=>{const cell=text('div','','metric');cell.append(text('span',m.label),text('b',m.value));return cell}));el('selections').replaceChildren(...snapshot.selections.map(s=>{const cell=text('div','','selection');cell.append(text('small',s.name),text('strong',s.selected==='REJECT'?'没有已确认可达的节点':s.selected));if(s.provisional)cell.append(text('p','观察期'));return cell}));
      const query=el('search').value.toLowerCase(),region=el('region').value,availability=el('availability').value;
      const rows=snapshot.rows.filter(n=>n.name.toLowerCase().includes(query)&&(region==='全部地区'||n.region===region)&&(availability==='all'||n.available===(availability==='available'))).sort((a,b)=>((b.rate??-1)-(a.rate??-1))*(descending?1:-1));
      el('empty').hidden=rows.length>0;el('empty').textContent=snapshot.rows.length?'没有符合条件的节点':'暂无节点。请启用订阅并等待内核运行。';
      el('rows').replaceChildren(...rows.map(n=>{const tr=document.createElement('tr');tr.dataset.id=n.id;const name=text('td','','name');name.append(text('span','',n.available?'dot good':'dot'),document.createTextNode(n.name));tr.append(name,text('td',n.region),text('td',n.rate===null?'—':n.rate.toFixed(2)+'%','rate'),text('td',`${n.total-n.failures} / ${n.total}`),text('td',n.median===null?'—':n.median+' ms'));const history=document.createElement('td');history.append(days(n.days));tr.append(history);tr.addEventListener('click',()=>{selected=n.id;renderDetail()});return tr}));
      el('updated').textContent='最近更新：'+new Date(snapshot.updatedAt).toLocaleString();renderDetail();}
    for(const id of ['search','region','availability'])el(id).addEventListener('input',render);
    el('sort').addEventListener('click',()=>{descending=!descending;el('sort').textContent='七天成功率 '+(descending?'↓':'↑');render()});
    window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='bun:snapshot')return;document.documentElement.dataset.theme=event.data.theme;snapshot=event.data.dashboard;render()});
    parent.postMessage({type:'bun:ready'},'*');
  </script>
</body>
</html>
